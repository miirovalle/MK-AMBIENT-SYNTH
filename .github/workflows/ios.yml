name: iOS (AUv3 + IPA)

# Builds both products for iPadOS on a macOS runner and packages an .ipa that
# contains the AUv3 extension. Unsigned by default (sideload-ready); switches to
# manual code signing when the signing secrets are configured.
#
# Required secrets for a signed, device-installable IPA:
#   BUILD_CERTIFICATE_BASE64      Apple Development .p12, base64 encoded
#   P12_PASSWORD                  password of that .p12
#   PROVISIONING_PROFILE_BASE64   .mobileprovision, base64 encoded
#   PROVISIONING_PROFILE_SPECIFIER  profile name exactly as in the portal
#   DEVELOPMENT_TEAM              Apple team id
# Without them the workflow still produces an unsigned IPA.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DEPLOYMENT_TARGET: "15.0"
  BUILD_DIR: build-ios

jobs:
  ipa:
    name: ${{ matrix.product.label }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product:
          - label: MK Ambient
            slug: mk-ambient
            project: .
          - label: MK RATTUS TRANCE GATE
            slug: mk-rattus-trance-gate
            project: MK RATTUS TRANCE GATE

    env:
      SIGNING_AVAILABLE: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Select the newest installed Xcode
        run: |
          set -eu
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -n 1

      - name: Import signing certificate
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eu
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          /usr/libexec/PlistBuddy -c 'Print :Name' profile.plist

      - name: Configure
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -eu
          common=(
            -S "${{ matrix.product.project }}"
            -B "$BUILD_DIR"
            -G Xcode
            -DCMAKE_SYSTEM_NAME=iOS
            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"
            -DMK_BUILD_TESTS=OFF
            -DMK_BUILD_RENDERER=OFF
            -DMK_BUILD_PLUGIN=ON
          )
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            echo "Configuring with manual code signing"
            cmake "${common[@]}" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="Apple Development" \
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER"
          else
            echo "Configuring unsigned"
            cmake "${common[@]}" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          fi

      - name: Build
        run: |
          set -eu
          cmake --build "$BUILD_DIR" --config Release --parallel 3

      - name: Package IPA
        run: |
          set -eu
          APP_PATH=$(find "$BUILD_DIR" -name '*.app' -type d -not -path '*/Disabled/*' | head -n 1)
          test -n "$APP_PATH" || { echo "No .app produced"; find "$BUILD_DIR" -maxdepth 6 -name '*.app*'; exit 1; }
          echo "App: $APP_PATH"

          APPEX_PATH=$(find "$APP_PATH" -name '*.appex' -type d | head -n 1)
          if [ -z "$APPEX_PATH" ] && [ "$SIGNING_AVAILABLE" != "true" ]; then
            # JUCE always embeds the extension, but recover gracefully if a future
            # version leaves it beside the app. Unsigned only: copying after signing
            # would invalidate the signature.
            SIDE_APPEX=$(find "$BUILD_DIR" -name '*.appex' -type d | head -n 1)
            if [ -n "$SIDE_APPEX" ]; then
              echo "Extension was not embedded; adding $SIDE_APPEX to PlugIns"
              mkdir -p "$APP_PATH/PlugIns"
              cp -R "$SIDE_APPEX" "$APP_PATH/PlugIns/"
              APPEX_PATH="$APP_PATH/PlugIns/$(basename "$SIDE_APPEX")"
            fi
          fi
          test -n "$APPEX_PATH" || { echo "No AUv3 .appex produced"; ls -R "$APP_PATH"; exit 1; }
          echo "AUv3 extension: $APPEX_PATH"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX_PATH/Info.plist"
          /usr/libexec/PlistBuddy \
            -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX_PATH/Info.plist"

          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            codesign --verify --deep --strict "$APP_PATH"
            codesign -dv --verbose=2 "$APP_PATH" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority' || true
          else
            echo "Unsigned build: sideload with Sideloadly/AltStore to re-sign on device."
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "${{ matrix.product.slug }}-ios.ipa"
          ls -lh "${{ matrix.product.slug }}-ios.ipa"

          mkdir -p auv3
          ditto -c -k --sequesterRsrc --keepParent "$APPEX_PATH" \
            "auv3/$(basename "$APPEX_PATH").zip"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product.slug }}-ipa
          path: ${{ matrix.product.slug }}-ios.ipa
          if-no-files-found: error

      - name: Upload AUv3 extension
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product.slug }}-auv3
          path: auv3/*.zip
          if-no-files-found: error
